```html
{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <h5>
                <i class="bi bi-pencil"></i> Edit Member
            </h5>

            <hr>

            <form method="POST"
                  action="{{ url_for('edit_member', member_id=member.id) }}">

                <div class="mb-3">
                    <label class="form-label">Full Name</label>

                    <input type="text"
                           name="fullname"
                           class="form-control"
                           value="{{ member.fullname }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           name="email"
                           class="form-control"
                           value="{{ member.email or '' }}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input type="tel"
                           name="phone"
                           class="form-control"
                           value="{{ member.phone or '' }}">
                </div>

                <div class="d-flex gap-2">

                    <button type="submit"
                            class="btn btn-primary flex-grow-1">

                        <i class="bi bi-check-circle"></i>
                        Update Member

                    </button>

                    <a href="{{ url_for('members') }}"
                       class="btn btn-secondary">

                        <i class="bi bi-x-circle"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>
    </div>

</div>

{% endblock %}
```
