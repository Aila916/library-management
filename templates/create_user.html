<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Create User Account</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f6f9;
        }

        .account-card {
            max-width: 600px;
            margin: 60px auto;
        }

        .card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .card-header {
            border-radius: 15px 15px 0 0 !important;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="account-card">

        <div class="card">

            <div class="card-header bg-primary text-white p-4">

                <h3 class="mb-1">
                    Create User Account
                </h3>

                <small>
                    Administrator access
                </small>

            </div>

            <div class="card-body p-4">

                {% with messages = get_flashed_messages(
                    with_categories=true
                ) %}

                    {% if messages %}

                        {% for category, message in messages %}

                            <div class="alert alert-{{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    {% endif %}

                {% endwith %}


                <form
                    method="POST"
                    action="{{ url_for('create_user') }}"
                >

                    <!-- USERNAME -->

                    <div class="mb-3">

                        <label class="form-label">
                            Username
                        </label>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                            autofocus
                        >

                    </div>


                    <!-- PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Enter password"
                            minlength="6"
                            required
                        >

                        <div class="form-text">
                            Password must contain at least 6 characters.
                        </div>

                    </div>


                    <!-- CONFIRM PASSWORD -->

                    <div class="mb-3">

                        <label class="form-label">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            name="confirm_password"
                            class="form-control"
                            placeholder="Confirm password"
                            minlength="6"
                            required
                        >

                    </div>


                    <!-- ROLE -->

                    <div class="mb-4">

                        <label class="form-label">
                            User Role
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required
                        >

                            <option value="librarian">
                                Librarian
                            </option>

                            <option value="admin">
                                Administrator
                            </option>

                        </select>

                    </div>


                    <!-- BUTTONS -->

                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Create Account
                        </button>

                        <a
                            href="{{ url_for('dashboard') }}"
                            class="btn btn-secondary"
                        >
                            Back to Dashboard
                        </a>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

</body>
</html>
