<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Library Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(
                135deg,
                #172033,
                #263653
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 20px;
        }

        .login-card {
            background: white;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #172033;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
        }

        .system-title {
            color: #172033;
            font-weight: 700;
        }

        .form-control {
            height: 48px;
            border-radius: 10px;
        }

        .input-group-text {
            background: white;
            border-radius: 10px 0 0 10px;
        }

        .login-btn {
            height: 48px;
            border-radius: 10px;
            background: #172033;
            border: none;
            font-weight: 600;
        }

        .login-btn:hover {
            background: #263653;
        }

        .footer-text {
            font-size: 13px;
            color: #777;
        }

    </style>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <!-- LOGO -->
        <div class="logo">
            <i class="bi bi-book"></i>
        </div>


        <!-- TITLE -->
        <div class="text-center mb-4">

            <h3 class="system-title">
                Library Management System
            </h3>

            <p class="text-muted mb-0">
                Management Dashboard
            </p>

        </div>


        <!-- FLASH MESSAGES -->
        {% with messages = get_flashed_messages(with_categories=true) %}

            {% if messages %}

                {% for category, message in messages %}

                    <div class="alert alert-{{ category }} alert-dismissible fade show"
                         role="alert">

                        <i class="bi
                        {% if category == 'success' %}
                            bi-check-circle
                        {% elif category == 'danger' %}
                            bi-exclamation-circle
                        {% else %}
                            bi-info-circle
                        {% endif %}
                        me-2"></i>

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert">
                        </button>

                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <!-- LOGIN FORM -->
        <form method="POST"
              action="{{ url_for('login') }}">

            <!-- USERNAME -->
            <div class="mb-3">

                <label for="username"
                       class="form-label fw-semibold">

                    Username

                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person"></i>
                    </span>

                    <input
                        type="text"
                        class="form-control"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                        autofocus>

                </div>

            </div>


            <!-- PASSWORD -->
            <div class="mb-4">

                <label for="password"
                       class="form-label fw-semibold">

                    Password

                </label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

                </div>

            </div>


            <!-- LOGIN BUTTON -->
            <button type="submit"
                    class="btn btn-primary login-btn w-100">

                <i class="bi bi-box-arrow-in-right me-2"></i>

                Login

            </button>

        </form>


        <!-- FOOTER -->
        <div class="text-center mt-4">

            <p class="footer-text mb-0">
                Library Management System
            </p>

        </div>

    </div>

</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
